[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "design-ledger"
version = "0.1.3"
description = "Shared design parameters with provenance, for Python and MATLAB teams"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledger = ["hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


